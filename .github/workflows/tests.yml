name: Tests

on:
  push:
    branches: ['**']

  pull_request_target:

env:
  # Increase this value to reset cache when MAGMA_URL changes.
  MAGMA_CACHE_NUMBER: 2.29-8

jobs:

  permission-check:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - id: check
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'push') {
              core.setOutput('allowed', 'true');
              return;
            }
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            const allowed = data.permission === 'write' || data.permission === 'admin';
            core.setOutput('allowed', String(allowed));

  matrix:
    runs-on: ubuntu-latest
    needs: permission-check
    if: needs.permission-check.outputs.allowed == 'true'
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_tests: ${{ steps.set-matrix.outputs.has_tests }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'push' }}

      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'pull_request_target' }}
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - id: set-matrix
        run: |
          matrix=$((
            echo '{ "target" : ['
            ls -1 Tests/*.m 2>/dev/null | grep -v '/_' | sed -r 's/^([^,]*)(,?)$/"\1"\2/' | paste -sd "," -
            echo " ]}"
          ) | jq -c .)
          echo $matrix
          echo $matrix | jq .
          count=$(echo "$matrix" | jq '.target | length')
          echo "matrix=$matrix" >> $GITHUB_OUTPUT
          echo "has_tests=$count" >> $GITHUB_OUTPUT

  check-matrix:
    runs-on: ubuntu-latest
    needs: matrix
    steps:
      - name: Install json2yaml
        run: |
          sudo npm install -g json2yaml

      - name: Check matrix definition
        run: |
          matrix='${{needs.matrix.outputs.matrix}}'
          echo $matrix
          echo $matrix | jq .
          echo $matrix | json2yaml

  has_access:
    runs-on: ubuntu-latest
    outputs:
      has_access: ${{ steps.my-key.outputs.has_access }}

    steps:
      - id: my-key
        env:
          MAGMA_URL: ${{ secrets.MAGMA_URL }}
        if: "${{ env.MAGMA_URL != '' }}"
        run: |
          echo "has_access=true" >> $GITHUB_OUTPUT

  check-has_access:
    runs-on: ubuntu-latest
    needs: has_access
    steps:
      - name: Check has_access definition
        run: |
          echo ${{needs.has_access.outputs.has_access}}

  prime-magma:
    runs-on: ubuntu-latest
    needs: [permission-check, has_access]
    if: needs.permission-check.outputs.allowed == 'true' && needs.has_access.outputs.has_access == 'true'
    steps:
      - name: Cache magma
        uses: actions/cache@v4
        id: magmacache
        with:
          path: |
            ./magma
          key:
            ${{ env.MAGMA_CACHE_NUMBER }}

      - name: Install magma
        env:
          MAGMA_URL: ${{ secrets.MAGMA_URL }}
        shell: bash
        if: steps.magmacache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3; do
            wget "$MAGMA_URL" -O magma.tar.gz --quiet && break
            echo "download attempt $i failed; retrying"; sleep 15
          done
          tar xf magma.tar.gz
          test -x ./magma/magma   # fail loudly so a bad download never poisons the cache

      - name: Create dummy network device
        shell: bash
        run: |
          sudo ip link add dumdum type dummy
          sudo ifconfig dumdum hw ether `./magma/magma -d | grep "Valid MAC addresses" -A1 | tail -n1`
          echo | ./magma/magma

  test:
    runs-on: ubuntu-latest
    name: Run tests
    needs: [permission-check, has_access, matrix, prime-magma]
    if: >
      needs.permission-check.outputs.allowed == 'true' &&
      needs.has_access.outputs.has_access == 'true' &&
      needs.matrix.outputs.has_tests != '0'
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.matrix.outputs.matrix)}}

    steps:
      - name: Checkout for a push event
        uses: actions/checkout@v4
        if: ${{ github.event_name == 'push' }}

      - name: Checkout for a PR event
        uses: actions/checkout@v4
        if: ${{ github.event_name == 'pull_request_target' }}
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Cache magma
        uses: actions/cache@v4
        id: magmacache
        with:
          path: |
            ./magma
          key:
            ${{ env.MAGMA_CACHE_NUMBER }}

      - name: Install magma
        env:
          MAGMA_URL: ${{ secrets.MAGMA_URL }}
        shell: bash
        if: steps.magmacache.outputs.cache-hit != 'true'
        run: |
          wget "$MAGMA_URL" -O magma.tar.gz --quiet
          tar xf magma.tar.gz

      - name: Create dummy network device
        shell: bash
        run: |
          sudo ip link add dumdum type dummy
          sudo ifconfig dumdum hw ether `./magma/magma -d | grep "Valid MAC addresses" -A1 | tail -n1`
          echo | ./magma/magma

      - name: Run tests
        shell: bash
        env:
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          ./magma/magma -b target:="$MATRIX_TARGET" exitsignal:="" run_tests.m
